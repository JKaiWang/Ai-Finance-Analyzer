[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28,<1",
    "pandas>=3.0.5",
    "python-dotenv>=1.0,<2",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4,<8",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
